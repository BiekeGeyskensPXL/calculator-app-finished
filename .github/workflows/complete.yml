name: Build Example
on:
  push:
    branches:
      - main
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
      - name: Verification
        run: ls -alhR
      - name: Bundle code into Zip
        run: zip -r bundle.zip .
      - name: check unit tests & report
        run: npm test 
             npm test --coverage
        
