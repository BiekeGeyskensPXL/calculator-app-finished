name: Build Example
on:
  push:
    branches:
      - main
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
      - name: Bundle code into Zip
        run: zip -r bundle.zip .
      - name: check unit tests & report
        run: |
          npm ci
          npm test --coverage --testlocationtestresults
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          results-path: ./.out/junit.xml
          coverage-path: coverage/lcov.info
