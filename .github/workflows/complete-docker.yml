name: Docker Example
on:
  push:
    branches:
      - main
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0
      - name: Bundle code into Zip
        run: zip -r bundle.zip .
      - name: check unit tests & report
        run: |
          npm install
          npm install --save-dev jest-junit
          npm test -- --ci --coverage --coverageReporters=lcov --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./.out
          JEST_JUNIT_OUTPUT_NAME: junit.xml
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          results-path: ./.out/junit.xml
          coverage-path: coverage/lcov.info

      - name: docker login
        uses: docker/build-push-action@v7
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: biekegeyskenspxl/app:latest
