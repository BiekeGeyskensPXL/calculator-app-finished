name: CI NodeJs
on: workflow_dispatch
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      # Installatie Node.js 
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # Installatie dependencies 
      - name: Install dependencies
        run: npm install
      
      # Uitvoering unit tests
      - name: Unit testing
        run: npm test

      # generatie test-coverage rapport 
      - name: Best Test Reports Action - test
        run: npm test -- --coverage --coverageReporters=lcov

      # Coverage of result tonen? 
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          coverage-path: coverage/lcov.info

      # Bouw docker image 
      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: biekegeyskenspxl/app:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          
      # Scan automatisch naar CVE's in de container
      - name: Scan CVE's
        uses: docker/scout-action@v1
        with:
          command: cves
          image: biekegeyskenspxl/app:latest









      
