name: CI NodeJs
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      # Installatie Node.js 
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      # Installatie dependencies 
      - name: Install dependencies
        run: npm install
      
      # Uitvoering unit tests
      - name: Unit testing
        run: npm test

      # generatie test-coverage rapport
      - name: Best Test Reports Action - test
        run: npm test -- --coverage

      # Coverage of result tonen? 
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          coverage-path: coverage/

      
