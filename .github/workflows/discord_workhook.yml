name: CI NodeJs
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
permissions:
  pull-requests: write
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      # 2. Installatie Node.js 
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 3. Installatie dependencies 
      - name: Install dependencies
        run: npm install
      
      # 4. Uitvoering tests + coverage (Slechts 1 keer nodig!)
      - name: Unit testing & Coverage
        run: npm test -- --coverage --coverageReporters=lcov

      # 5. Coverage tonen in Actions
      - name: Better Test Reports Action
        uses: mridang/action-test-reporter@v3.0.1
        with:
          name: Unit tests
          coverage-path: coverage/lcov.info

      # 6. Coverage percentage berekenen (Veilig, crasht niet bij fouten)
      - name: Get Coverage
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            LF=$(grep 'LF:' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
            LH=$(grep 'LH:' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
            if [ "$LF" -gt 0 ]; then
              echo "COVERAGE=$(( 100 * LH / LF ))%" >> $GITHUB_ENV
            else
              echo "COVERAGE=Onbekend" >> $GITHUB_ENV
            fi
          else
            echo "COVERAGE=Geen rapport" >> $GITHUB_ENV
          fi

      # 7. PR Comment (Alleen als het een PR is)
      - name: PR Comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Build Status:** ${{ job.status == 'success' && '✅ Succes' || '❌ Gefaald' }}
            **Coverage:** ${{ env.COVERAGE }}

      # 8. Discord Notificatie (Alleen voor main of PR)
      - name: Discord
        if: always() && (github.ref_name == 'main' || github.event_name == 'pull_request')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ job.status == 'success' && '✅ Succes' || '❌ Gefaald' }}"
          EVENT="${{ github.event_name == 'pull_request' && 'Pull Request' || 'Push' }}"
          
          curl -H "Content-Type: application/json" \
               -d "{\"content\": \"**$EVENT** op branch **${{ github.ref_name }}**\nStatus: $STATUS\nCoverage: ${{ env.COVERAGE }}\"}" \
               $DISCORD_WEBHOOK
