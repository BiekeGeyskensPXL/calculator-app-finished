name: CI NodeJs
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      
permissions:
  pull-requests: write
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Unit testing & Coverage
        run: npm test -- --coverage --coverageReporters=lcov

      - name: Better Test Reports Action
        if: always()
        uses: mridang/action-test-reporter@v3
        with:
          name: Unit tests
          coverage-path: coverage/lcov.info
          fail-on-empty: false

      # Coverage berekenen (100% crash-proof)
      - name: Get Coverage
        id: cov
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            LF=$(grep -o 'LF:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
            LH=$(grep -o 'LH:[0-9]*' coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
            LF=${LF:-0}
            LH=${LH:-0}
            if [ "$LF" -gt 0 ]; then
              echo "percentage=$(( 100 * LH / LF ))%" >> $GITHUB_OUTPUT
            else
              echo "percentage=Onbekend" >> $GITHUB_OUTPUT
            fi
          else
            echo "percentage=Geen rapport" >> $GITHUB_OUTPUT
          fi

      # PR Comment
      - name: PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Build Status:** ${{ job.status == 'success' && '✅ Succes' || '❌ Gefaald' }}
            **Coverage:** ${{ steps.cov.outputs.percentage }}

      # Discord Notificatie
      - name: Discord
        if: always() && (github.ref_name == 'main' || github.event_name == 'pull_request')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COV_TEXT: ${{ steps.cov.outputs.percentage }}
        run: |
          STATUS="${{ job.status == 'success' && '✅ Succes' || '❌ Gefaald' }}"
          EVENT="${{ github.event_name == 'pull_request' && 'Pull Request' || 'Push' }}"
          
          # De -f flag zorgt dat de stap FAALT (rood wordt) als Discord een foutmelding geeft
          curl -f -H "Content-Type: application/json" \
               -d "{\"content\": \"**$EVENT** op branch **${{ github.ref_name }}**\nStatus: $STATUS\nCoverage: $COV_TEXT\"}" \
               $DISCORD_WEBHOOK
